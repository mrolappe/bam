[workspace]
resolver = "2"
members = ["crates/bam-core", "crates/bam-tui"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
bam-core = { path = "crates/bam-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chardetng = "0.1"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
