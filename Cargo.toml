[workspace]
resolver = "2"
members = ["crates/bam-core", "crates/bam-tui"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
bam-core = { path = "crates/bam-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chardetng = "0.1"
encoding_rs = "0.8"
blake3 = "1"
flate2 = "1"
zip = { version = "7", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
reqwest = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
schemars = "0.8"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
