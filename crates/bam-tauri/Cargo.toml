[package]
name = "bam-tauri"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bam_tauri"
path = "src/lib.rs"

[[bin]]
name = "bam-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bam-core.workspace = true
bam-server = { path = "../bam-server" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
